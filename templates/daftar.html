{{define "content"}}
<div class="auth-card card elev-md">
  <div class="brand auth-brand">Rukun</div>
  <p class="text-muted small">Buat akun dulu, lalu pilih keluarga</p>

  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}

  <form method="post" action="/daftar" class="stack-sm">
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" name="email" type="email" required maxlength="254"
             autocomplete="email" value="{{with .Form}}{{.Email}}{{end}}" placeholder="nama@email.com">
    </div>
    <div class="field">
      <label for="nama">Nama</label>
      <input class="input" id="nama" name="nama" required autofocus
             placeholder="Ayah" value="{{with .Form}}{{.Nama}}{{end}}">
      <p class="hint">Nama ini muncul di "Dicatat oleh" tiap transaksi.</p>
    </div>
    <div class="field">
      <label for="sandi">Kata Sandi</label>
      <input class="input" id="sandi" name="sandi" type="password" required minlength="8"
             autocomplete="new-password">
      <p class="hint">Minimal 8 karakter.</p>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Buat akun</button>
  </form>

  <p class="small text-muted auth-alt">Sudah punya akun? <a href="/masuk">Masuk</a>.</p>
</div>
{{end}}
