{{define "content"}}
<div class="auth-card card elev-md">
  <div class="brand auth-brand">Rukun</div>
  <p class="text-muted small">Keuangan {{.Family}}</p>

  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}

  <form method="post" action="/masuk" class="stack-sm">
    <div class="field">
      <label for="nama">Nama</label>
      <input class="input" id="nama" name="nama" required autofocus autocomplete="username"
             value="{{with .Form}}{{.Nama}}{{end}}">
    </div>
    <div class="field">
      <label for="sandi">Kata Sandi</label>
      <input class="input" id="sandi" name="sandi" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Masuk</button>
  </form>

  <p class="small text-muted auth-alt">
    {{if .Kosong}}Belum ada akun di sini. <a href="/daftar">Buat akun pertama</a>.
    {{else}}Anggota keluarga baru? <a href="/daftar">Daftar dengan kode undangan</a>.{{end}}
  </p>
</div>
{{end}}
