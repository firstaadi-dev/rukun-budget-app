{{define "content"}}
<div class="auth-card card elev-md">
  <div class="brand auth-brand">Rukun</div>
  <p class="text-muted small">Keuangan keluarga</p>

  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}

  <form method="post" action="/masuk" class="stack-sm">
    <div class="field">
      <label for="kode">Kode Keluarga</label>
      <input class="input" id="kode" name="kode" required autocomplete="off"
             value="{{with .Form}}{{.Kode}}{{end}}" placeholder="abcde-fghij-klmno">
      <p class="hint">Menentukan keluarga mana yang dimaksud. Cukup diisi sekali,
        setelah itu diingat di perangkat ini.</p>
    </div>
    <div class="field">
      <label for="nama">Nama</label>
      <input class="input" id="nama" name="nama" required autocomplete="username"
             value="{{with .Form}}{{.Nama}}{{end}}">
    </div>
    <div class="field">
      <label for="sandi">Kata Sandi</label>
      <input class="input" id="sandi" name="sandi" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Masuk</button>
  </form>

  <p class="small text-muted auth-alt">
    Anggota keluarga baru? <a href="/daftar">Daftar dengan kode undangan</a>.
  </p>
</div>
{{end}}
