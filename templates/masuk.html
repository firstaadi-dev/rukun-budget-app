{{define "content"}}
<div class="auth-card card elev-md">
  <div class="brand auth-brand">Rukun</div>
  <p class="text-muted small">Keuangan keluarga</p>

  {{if .EmailVerified}}<p class="banner" role="status">Email sudah diverifikasi. Silakan masuk.</p>{{end}}
  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}

  <form method="post" action="/masuk" class="stack-sm">
    <div class="field">
      <label for="identifier">Email atau nama akun lama</label>
      <input class="input" id="identifier" name="identifier" type="text" required autocomplete="username"
             value="{{with .Form}}{{.Identifier}}{{end}}">
    </div>
    <div class="field">
      <label for="sandi">Kata Sandi</label>
      <input class="input" id="sandi" name="sandi" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Masuk</button>
  </form>


  <p class="small text-muted auth-alt">
    Belum punya akun? <a href="/daftar">Buat akun</a>.
  </p>
</div>
{{end}}
