{{define "content"}}
<div class="auth-card card elev-md stack-lg">
  <div class="brand auth-brand">Rukun</div>
  <h4>Mulai bersama keluarga</h4>
  <p class="text-muted small">Halo, {{.User.Name}}. Buat keluarga baru atau gabung dengan kode dari anggota keluarga.</p>
  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
  <section>
    <h6>Buat keluarga baru</h6>
    <form method="post" action="/mulai/buat" class="stack-sm">
      <label for="nama-keluarga">Nama keluarga</label>
      <input class="input" id="nama-keluarga" name="nama" required minlength="2" maxlength="80" placeholder="Keluarga Kami">
      <button class="btn btn-primary btn-block" type="submit">Buat keluarga</button>
    </form>
  </section>
  <section>
    <h6>Gabung keluarga</h6>
    <form method="post" action="/mulai/gabung" class="stack-sm">
      <label for="nama-anggota">Nama tampilan di keluarga</label>
      <input class="input" id="nama-anggota" name="nama" required minlength="2" maxlength="128" value="{{.User.Name}}">
      <label for="kode">Kode keluarga</label>
      <input class="input" id="kode" name="kode" required value="{{.Kode}}" autocomplete="off" placeholder="abcde-fghij-klmno">
      <button class="btn btn-secondary btn-block" type="submit">Gabung</button>
    </form>
  </section>
  <form method="post" action="/keluar"><button class="linkish" type="submit">Keluar</button></form>
</div>
{{end}}
