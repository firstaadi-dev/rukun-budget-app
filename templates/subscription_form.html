{{define "content"}}
<form method="post" action="{{if .ID}}/subscription/{{.ID}}/ubah{{else}}/subscription/baru{{end}}" class="stack ledger-form">
  <div class="field"><label for="nama">Nama</label><input class="input" id="nama" name="nama" required maxlength="60" value="{{.Form.nama}}" placeholder="Netflix"></div>
  <div class="field"><label for="dompet">Dompet</label><select class="input" id="dompet" name="dompet">{{range .Wallets}}<option value="{{.ID}}" {{if eq $.Form.dompet (printf "%d" .ID)}}selected{{end}}>{{.Name}} · {{.Currency}}</option>{{end}}</select></div>
  <div class="field"><label for="kategori">Kategori pengeluaran</label><select class="input" id="kategori" name="kategori">{{range .Categories}}<option {{if eq $.Form.kategori .}}selected{{end}}>{{.}}</option>{{end}}</select></div>
  <div class="field"><label for="nominal">Nominal</label><input class="input" id="nominal" name="nominal" inputmode="decimal" required value="{{.Form.nominal}}"></div>
  <div class="field"><label for="tanggal">Tanggal berikutnya</label><input class="input" id="tanggal" name="tanggal" type="date" required value="{{.Form.tanggal}}"></div>
  <div class="field"><label for="interval">Jadwal</label><select class="input" id="interval" name="interval">{{range .Intervals}}<option value="{{.Value}}" {{if eq (printf "%d" .Value) $.Form.interval}}selected{{end}}>{{.Label}}</option>{{end}}</select></div>
  {{if .ID}}<label class="pilih-semua"><input type="checkbox" name="aktif" value="1" {{if .Active}}checked{{end}}> Langganan aktif</label>{{end}}
  <button class="btn btn-primary btn-block">Simpan</button>
</form>
{{end}}
