# Blueprint Render. Deploy: Render Dashboard → New → Blueprint → pilih repo ini.
#
# Databasenya di Neon, bukan Postgres bawaan Render, jadi berkas ini hanya
# mengurus web service. Pilih region Singapore untuk keduanya: proyek Neon-nya
# ada di ap-southeast, dan setiap query menyeberang region akan menambah puluhan
# milidetik pada setiap permintaan halaman.

services:
  - type: web
    name: rukun
    runtime: go
    region: singapore
    plan: free
    branch: main
    buildCommand: go build -o rukun .
    startCommand: ./rukun
    healthCheckPath: /healthz
    envVars:
      # Connection string Neon. sync: false berarti Render menanyakannya saat
      # deploy dan menyimpannya di dashboard — sengaja tidak ditulis di sini,
      # karena berkas ini masuk git sedangkan isinya kredensial.
      #
      # Pakai connection string yang TANPA "-pooler" di nama host. Aplikasi ini
      # sudah punya pool sendiri lewat pgxpool, dan pooler Neon berjalan dalam
      # mode transaksi yang bisa berbenturan dengan prepared statement pgx.
      - key: DATABASE_URL
        sync: false
      # Token API admin, dipakai untuk membuat keluarga baru lewat curl.
      # Dibuat acak oleh Render; lihat nilainya di tab Environment.
      # Kalau dikosongkan, endpoint /admin/* mati total.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BASE_CURRENCY
        value: IDR
      - key: APP_TZ
        value: Asia/Jakarta
      # Kunci Twelve Data, sumber harga ketiga. Yahoo membatasi permintaan per
      # alamat IP dan Render memakai alamat bersama, jadi 429 datang dari
      # tetangga — batas Twelve Data dihitung per akun dan tidak ikut habis.
      # Daftar gratis di twelvedata.com/pricing, lalu isi nilainya di tab
      # Environment. Dikosongkan berarti sumber itu mati dan aplikasi tetap
      # jalan dengan Yahoo saja. Lihat README bagian "Kalau harga pasar sering
      # gagal".
      - key: HARGA_TWELVE_KEY
        sync: false
